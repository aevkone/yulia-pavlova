<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Обложка ТГ-канала</title>
<style>
/* тёмные цвета сайта, шрифты карусели «Маркер» */
@font-face{font-family:'Oswald';font-weight:600;src:url(fonts/Oswald-SemiBold.ttf)}
@font-face{font-family:'JetBrains Mono';src:url(fonts/JetBrainsMono-Regular.ttf)}
@font-face{font-family:'Manrope';font-weight:200 800;src:url(fonts/Manrope-Variable.ttf)}
:root{--bg:#0B0B0A;--accent:#D9714F;--white:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:var(--bg);color:var(--white);position:relative;font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased}
.photo{position:absolute;left:960px;top:0;width:960px;height:1080px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 340px);mask-image:linear-gradient(90deg,transparent 0,#000 340px)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 44%;filter:brightness(.78)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,11,10,.65),rgba(11,11,10,0) 35%)}
.wrap{position:absolute;left:150px;top:250px}
.mono{font-family:'JetBrains Mono',monospace;font-size:30px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{margin-top:34px;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:150px;line-height:1}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin-top:44px;font-size:40px;line-height:1.35;font-weight:500}
/* графика поверх фото: кольцо вокруг Юли, как на аватарке, и «точка» */
.ring{position:absolute;left:1243px;top:150px;width:540px;height:540px;border-radius:50%;border:6px solid var(--accent)}
.ring2{position:absolute;left:1203px;top:110px;width:620px;height:620px;border-radius:50%;border:1.5px solid rgba(217,113,79,.45)}
.dot{position:absolute;left:1689px;top:590px;width:44px;height:44px;border-radius:50%;background:var(--accent)}
.chips{margin-top:46px;display:flex;gap:16px}
.chips span{font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.14em;text-transform:uppercase;border:2px solid var(--accent);border-radius:40px;padding:12px 26px}
</style></head>
<body>
<div class="photo"><img src="yulia_wine.jpg" alt=""></div>
<div class="ring2"></div><div class="ring"></div><div class="dot"></div>
<div class="wrap">
  <p class="mono">17 лет в стройке и 4 своих бизнеса</p>
  <h1>Канал<br><em>Павловой</em></h1>
  <p class="sub">Прямо об отношениях, работе и решениях.<br>Без воды и готовых рецептов</p>
  <div class="chips"><span>Отношения</span><span>Работа</span><span>Выбор</span></div>
</div>
</body></html>
