<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Обложка ВК, тёмная с фото</title>
<style>
@font-face{font-family:'Geist';font-weight:400 600;src:url(../../../fonts/Geist-cyrillic-0.woff2) format('woff2');unicode-range:U+0400-045F,U+2116;}
@font-face{font-family:'Geist';font-weight:400 600;src:url(../../../fonts/Geist-latin-1.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F;}
:root{--off:#0B0B0A;--ink:#fff;--gray:#A29C94;--accent:#D9714F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:768px;overflow:hidden}
body{font-family:'Geist',sans-serif;font-weight:500;color:var(--ink);background:var(--off);position:relative;-webkit-font-smoothing:antialiased}
/* фото Юли справа, левый край растворяется в тёмном фоне */
.photo{position:absolute;left:1030px;top:0;width:760px;height:768px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 280px,#000 calc(100% - 140px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 280px,#000 calc(100% - 140px),transparent)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 39%;filter:saturate(.85) brightness(.8)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,11,10,.6),rgba(11,11,10,0) 35%)}
.wrap{position:absolute;left:380px;top:160px;width:1000px}
.logo{font-size:34px;letter-spacing:-.02em}
.logo i{font-style:normal;color:var(--accent)}
h1{margin-top:58px;font-size:84px;line-height:1.02;letter-spacing:-.045em;font-weight:500}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin-top:40px;font-size:27px;line-height:1.35;letter-spacing:-.01em;color:var(--gray);font-weight:400}
.sub b{font-weight:500;color:var(--ink)}
</style></head>
<body>
<div class="photo"><img src="yulia_wine.jpg" alt=""></div>
<div class="wrap">
  <div class="logo">Юлия Павлова<i>.</i></div>
  <h1>Вижу <em>суть</em> там,<br>где вы видите тупик</h1>
  <p class="sub">Личные консультации: отношения, работа, решения.<br><b>17 лет в стройке и 4 своих бизнеса</b> – говорю прямо, по делу</p>
</div>
</body></html>
