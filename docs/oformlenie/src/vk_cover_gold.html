<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Обложка ВК, золото</title>
<style>
/* стиль карусели «Маркер», цвет amber */
@font-face{font-family:'Oswald';font-weight:600;src:url(fonts/Oswald-SemiBold.ttf)}
@font-face{font-family:'JetBrains Mono';src:url(fonts/JetBrainsMono-Regular.ttf)}
@font-face{font-family:'Manrope';font-weight:200 800;src:url(fonts/Manrope-Variable.ttf)}
:root{--bg:#0B0B0A;--gold:#C9A24B;--ink:#121211;--white:#fff;--gray:#B5AEA4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:768px;overflow:hidden}
body{background:var(--bg);color:var(--white);position:relative;font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased}
.photo{position:absolute;left:1030px;top:0;width:760px;height:768px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 280px,#000 calc(100% - 140px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 280px,#000 calc(100% - 140px),transparent)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 39%;filter:brightness(.82) sepia(.12)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,11,10,.6),rgba(11,11,10,0) 35%)}
.wrap{position:absolute;left:380px;top:140px}
.tag{display:inline-block;background:var(--gold);color:var(--white);font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.22em;text-transform:uppercase;padding:12px 22px}
h1{margin-top:46px;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:80px;line-height:1}
h1 span{display:inline-block;padding:6px 22px 12px}
h1 .g{background:var(--gold);color:var(--white)}
h1 .w{background:var(--white);color:var(--ink);box-shadow:-18px 0 0 var(--gold) inset}
.sub{margin-top:34px;font-size:30px;line-height:1.35;font-weight:500}
.mono{margin-top:22px;font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
</style></head>
<body>
<div class="photo"><img src="yulia_wine.jpg" alt=""></div>
<div class="wrap">
  <div class="tag">Юлия Павлова</div>
  <h1><span class="g">Вижу суть там,</span><br><span class="w">где вы видите тупик</span></h1>
  <p class="sub">Личные консультации: отношения, работа, решения.</p>
  <p class="mono">17 лет в стройке и 4 своих бизнеса</p>
</div>
</body></html>
